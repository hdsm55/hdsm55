<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Husam Al-Dhaheri — Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161331"/>
      <stop offset="55%" stop-color="#241f4d"/>
      <stop offset="100%" stop-color="#0b0a1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="90%" r="55%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#22D3EE;#8B5CF6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#8B5CF6;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.1"/></filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glowA)"/>
  <rect width="1200" height="300" fill="url(#glowB)"/>

  <g opacity="0.5" fill="#a78bfa">
    <circle cx="140" cy="70" r="2.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="220" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="60" r="2.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="205" r="1.6"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="4.8s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="40" r="1.5"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="7.2s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="600" y="132" font-size="58" font-weight="700" fill="#f8fafc" letter-spacing="1">Husam Al-Dhaheri</text>
    <rect x="440" y="158" width="320" height="3" rx="1.5" fill="url(#accent)"><animate attributeName="width" values="0;320;320" dur="1.6s" fill="freeze"/><animate attributeName="x" values="600;440;440" dur="1.6s" fill="freeze"/></rect>
    <text x="600" y="200" font-size="23" fill="#c7c9f5" letter-spacing="2.5">FULL-STACK DEVELOPER</text>
    <text x="600" y="236" font-size="16" fill="#8b8fb3" letter-spacing="1.2">TypeScript · Next.js · Node.js · Python · PostgreSQL</text>
  </g>

  <g stroke="#8B5CF6" stroke-opacity="0.35" fill="none" stroke-width="1">
    <path d="M0 292 Q 300 268 600 288 T 1200 276" opacity="0.7">
      <animate attributeName="stroke-opacity" values="0.25;0.6;0.25" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
