<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-label="divider">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="250" y="11" width="700" height="2" rx="1" fill="url(#dg)"/>
  <circle cx="600" cy="12" r="2.6" fill="#22D3EE">
    <animate attributeName="cx" values="300;900;300" dur="11s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;1;0.3" dur="11s" repeatCount="indefinite"/>
  </circle>
</svg>
