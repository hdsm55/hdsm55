name: Update stats

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gen-stats.mjs"
      - "scripts/gen-activity.mjs"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate stats + activity SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/gen-stats.mjs
          node scripts/gen-activity.mjs
          node scripts/gen-insights.mjs
          node scripts/gen-rhythm.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "chore: refresh stats & insights [skip ci]"
          git push
